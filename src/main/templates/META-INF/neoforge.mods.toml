# SmartHorde mod metadata (processed by generateModMetadata; ${} placeholders expand at build time).
modLoader="javafml"

# javafml loader language version; [4,) matches NeoForge 21.1 mod loading (aligned with the released 1.0.2 jar).
loaderVersion="${loader_version_range}"

license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="SmartHorde Dev"
description='''
SmartHorde — 智能AI尸潮系统。
为 Minecraft 带来具备战术行为的智能怪物：招式化连招、闪避、绕后包抄、
攀爬翻墙、叠罗汉、Boss 级单位、夜间自动尸潮。
一切数值配置化，零硬编码魔法数字。
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
